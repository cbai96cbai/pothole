<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" role="img" aria-labelledby="t d">
<title id="t">How pothole fits together</title>
<desc id="d">NYC 311 data is loaded into a local store and checked. A fixed rule or a repair agent decides what to do about a failed check and files a pull request or an issue. The store also feeds a spike screen, an AI investigator and a findings file. Run records and findings become site data, which builds the site. GitHub Actions runs all of it once a day.</desc>
