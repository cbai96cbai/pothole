<line x1="735.0" y1="226" x2="735.0" y2="280" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="60" width="130" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="95.0" y="84" text-anchor="middle" font-weight="600">NYC 311</text><text x="95.0" y="102" text-anchor="middle" font-size="11" fill="#475569">public open data</text>
<rect x="190" y="60" width="130" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="255.0" y="84" text-anchor="middle" font-weight="600">Load and store</text><text x="255.0" y="102" text-anchor="middle" font-size="11" fill="#475569">local database</text>
<rect x="350" y="60" width="130" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="415.0" y="84" text-anchor="middle" font-weight="600">Checks</text><text x="415.0" y="102" text-anchor="middle" font-size="11" fill="#475569">on each day&#39;s rows</text>
<rect x="510" y="60" width="130" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="575.0" y="84" text-anchor="middle" font-weight="600">Decide</text><text x="575.0" y="102" text-anchor="middle" font-size="11" fill="#475569">fixed rule or agent</text>
<rect x="670" y="60" width="130" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="735.0" y="84" text-anchor="middle" font-weight="600">Pull request</text><text x="735.0" y="102" text-anchor="middle" font-size="11" fill="#475569">or issue</text>
<rect x="190" y="170" width="130" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="255.0" y="194" text-anchor="middle" font-weight="600">Spike screen</text><text x="255.0" y="212" text-anchor="middle" font-size="11" fill="#475569">unusual counts</text>
<rect x="350" y="170" width="130" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="415.0" y="194" text-anchor="middle" font-weight="600">Investigator</text><text x="415.0" y="212" text-anchor="middle" font-size="11" fill="#475569">AI, cites evidence</text>
<rect x="510" y="170" width="130" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="575.0" y="194" text-anchor="middle" font-weight="600">Findings</text><text x="575.0" y="212" text-anchor="middle" font-size="11" fill="#475569">one file per day</text>
